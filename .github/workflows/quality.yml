name: Qualidade
on: [push, pull_request]
permissions:
  contents: read
jobs:
  database-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d security_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: disposable_ci_password
      PGDATABASE: security_test
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
      - name: Aplicar migrações no banco descartável
        run: |
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/audit.sql
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:coverage
      - run: npm run build
        env:
          # Configuração sintética para compilar no CI; não publicar esse artefato.
          VITE_SUPABASE_URL: https://fixture.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_fixture_not_a_real_key
